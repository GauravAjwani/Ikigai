display_name: Precedent
features:
  app_home:
    messages_tab_enabled: false
  slash_commands:
    - command: /precedent
      description: Search the organization's decision history
      should_escape: false
    - command: /check-precedent
      description: Check this conversation against prior decisions
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - channels:history
      - groups:history
      - search:read.public
      - app_mentions:read
    user:
      - search:read.public
      - search:read.private
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
